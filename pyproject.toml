[project]
name = "knowledge-copilot"
version = "0.1.0"
description = "Hybrid RAG + guarded text-to-SQL copilot with role-based document access"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "numpy>=1.26", "pyjwt>=2.8", "sqlglot>=25", "pydantic>=2"]

[project.scripts]
copilot = "copilot.cli:main"

[project.optional-dependencies]
gcp = ["google-genai>=1.0", "psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27", "google-genai>=1.0", "psycopg[binary]>=3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["copilot"]

[tool.setuptools.package-data]
copilot = ["static/*.html"]
