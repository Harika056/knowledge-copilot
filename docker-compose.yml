# Runs Postgres+pgvector and the API together:  docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: copilot, POSTGRES_PASSWORD: copilot, POSTGRES_DB: copilot }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U copilot"], interval: 3s, retries: 20 }
  api:
    build: .
    depends_on: { db: { condition: service_healthy } }
    ports: ["8080:8080"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://copilot:copilot@db:5432/copilot
volumes:
  pgdata:
