name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: copilot, POSTGRES_PASSWORD: copilot, POSTGRES_DB: copilot }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://copilot:copilot@127.0.0.1:5432/copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,gcp]"
      - run: pytest -q          # includes the tests against real Postgres + pgvector
      - name: Evaluation harness runs end to end (offline demo)
        run: python eval/run_eval.py
